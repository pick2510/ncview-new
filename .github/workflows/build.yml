name: Build

# Reusable workflow: builds, tests, and packages ncview for Linux, macOS, and
# Windows. Called by ci.yml (on every push/PR) and release.yml (on a version
# tag) so the two never drift apart -- a release is built by the exact same
# steps CI already verified.
on:
  workflow_call:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnetcdf-dev libexpat1-dev \
            libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev \
            flex bison texinfo patchelf \
            xvfb imagemagick netcdf-bin fonts-dejavu-core
          # fonts-dejavu-core: tests/ui_smoke/golden/*.png were captured
          # against DejaVu Sans (FLTK's resolved default font wherever it's
          # installed). ui_smoke.sh does an exact-pixel compare, so the
          # runner needs the identical font available or every text label
          # renders with different glyph shapes.

      # ui_smoke's exact-pixel compare's actual first failure on this runner
      # (diagnosed via the ui_smoke-failure artifact) wasn't the font itself
      # -- it was this runner's fontconfig defaulting to RGB subpixel (LCD)
      # antialiasing, producing colored fringing (e.g. a pixel golden-gray
      # (72,72,72) came out amber (136,72,14) here) at every glyph and shape
      # edge, versus the plain grayscale antialiasing the goldens were
      # captured with. Force grayscale everywhere so glyph/edge rendering
      # matches byte-for-byte instead of just approximately.
      - name: Force grayscale font antialiasing (match ui_smoke goldens)
        run: |
          sudo tee /etc/fonts/local.conf > /dev/null <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <match target="font">
              <edit name="rgba" mode="assign"><const>none</const></edit>
              <edit name="antialias" mode="assign"><bool>true</bool></edit>
            </match>
          </fontconfig>
          EOF
          fc-cache -f

      # -DFLTK_BACKEND_WAYLAND=OFF: this project always forces
      # FLTK_BACKEND=x11 at runtime (see README), and none of the
      # Wayland/GTK dev packages that backend needs are installed above --
      # explicit here instead of relying on FLTK's own auto-detection
      # fallback, so a runner image that happens to have them preinstalled
      # doesn't silently change what gets built and linked.
      #
      # -DFLTK_BUILD_GL=OFF: ncview never uses OpenGL (no Fl_Gl_Window),
      # and building FLTK's GL support needs OpenGL headers that aren't
      # part of this runner image's default install (only the loader
      # library is) -- skip it rather than pull in a GL dev package for
      # code that's never linked into ncview anyway.
      # -DNCVIEW_BUILD_UI_TESTS=ON: this job has Xvfb/ImageMagick/ncgen
      # installed above, so it's the one place tests/ui_smoke.sh (the
      # Xvfb screenshot regression harness, modernization.md Phase 0c) can
      # actually run -- macOS/Windows jobs don't get this flag.
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DFLTK_BACKEND_WAYLAND=OFF -DFLTK_BUILD_GL=OFF
          -DNCVIEW_BUILD_UI_TESTS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # ui_smoke.sh leaves its scratch dir (actual screenshots, logs) behind
      # under /tmp on failure instead of cleaning it up -- upload it so a
      # future regression's actual-vs-golden diff can be inspected directly
      # instead of re-diagnosed blind, the way this job's original failure
      # against real CI (never exercised until the fontconfig fix above)
      # had to be.
      - name: Upload ui_smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui_smoke-failure
          path: /tmp/tmp.*
          if-no-files-found: ignore

      - name: Package
        run: cmake --build build --target package -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: ncview-linux
          path: build/ncview-*.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install netcdf expat texinfo flex bison
          # Homebrew's texinfo/flex/bison are keg-only (macOS ships its own,
          # much older copies) -- add them to PATH so CMake's
          # find_program(MAKEINFO)/FLEX/BISON pick up working ones. The
          # vendored UDUNITS-2 build needs a real makeinfo (its CMakeLists.txt
          # depends on the generated .info/.html unconditionally once one is
          # found, so its absence must mean "skip", not "use whatever old one
          # macOS ships") and our own top-level CMakeLists.txt needs a real
          # flex/bison to pre-generate UDUNITS-2's parser.c/scanner.c.
          {
            echo "$(brew --prefix texinfo)/bin"
            echo "$(brew --prefix flex)/bin"
            echo "$(brew --prefix bison)/bin"
          } >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cmake --build build --target package -j"$(sysctl -n hw.ncpu)"

      - uses: actions/upload-artifact@v4
        with:
          name: ncview-macos
          path: build/ncview-*.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # This project builds on Windows via MinGW-w64 GCC (through MSYS2),
      # not MSVC/vcpkg -- MSYS2's pacman has a prebuilt mingw-w64 netcdf
      # package, avoiding a from-source vcpkg build, and GCC keeps the
      # toolchain consistent with the linux job. flex and bison are the
      # plain MSYS2 (not mingw-w64-prefixed) packages deliberately --
      # they're host code-generator tools invoked once by our own
      # top-level CMakeLists.txt, not something linked into ncview.
      #
      # Deliberately NOT installing `texinfo` here: see CMakeLists.txt's
      # WIN32 block -- MSYS2's makeinfo is a Perl script ninja (a native
      # Windows process) can't invoke at all, and ncview has no use for
      # UDUNITS-2's own documentation anyway, so it's simplest to just let
      # find_program(MAKEINFO) find nothing.
      - name: Set up MSYS2 / MinGW64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-netcdf
            mingw-w64-x86_64-expat
            flex
            bison

      # -DFLTK_BUILD_GL=OFF: see the linux job -- ncview never uses OpenGL.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DFLTK_BUILD_GL=OFF

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cmake --build build --target package -j

      - uses: actions/upload-artifact@v4
        with:
          name: ncview-windows
          path: build/ncview-*.zip

  # modernization.md Phase 0d / PORTING.md's own verification step 5 ("Leak/
  # UB pass -- the mechanical C->C++ conversion of 14k lines is exactly
  # where this pays off"). Linux-only (ASan/UBSan support on the other two
  # platforms' toolchains here is less reliable, and one clean sanitizer
  # signal is enough to act on). Debug, not RelWithDebInfo, for accurate
  # stack traces and so -O2 doesn't optimize away what UBSan is looking for.
  # No package/upload steps: this job exists to fail loudly on real bugs
  # while the core modernization work is in progress, not to ship a
  # release artifact -- see core/WARNINGS.md for the equivalent approach to
  # the -Wall/-Wextra baseline.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnetcdf-dev libexpat1-dev \
            libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev \
            flex bison texinfo patchelf

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DFLTK_BACKEND_WAYLAND=OFF -DFLTK_BUILD_GL=OFF
          -DNCVIEW_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # A single portable binary for HPC clusters, whose sysadmin-controlled
  # module systems routinely can't offer a matching netCDF/HDF5, or any
  # netCDF/HDF5 at all -- see README.md's "Static linking" section and
  # NCVIEW_STATIC_LINK in the top-level CMakeLists.txt. Built inside a
  # ubuntu:18.04 container (glibc 2.27) rather than on the runner's own,
  # much newer Ubuntu image: glibc is forward- but not backward-compatible
  # (a binary linked against an old glibc runs fine on a newer one, never
  # the reverse), so building old is what makes "runs anywhere" true --
  # 2.27 predates even RHEL8's glibc (2.28), covering essentially every
  # HPC login/compute node still in service. Confirmed against a real
  # RHEL8-family image (quay.io/pypa/manylinux_2_28_x86_64, standing in for
  # an actual cluster node) during development: `ldd` on that completely
  # different distro resolved every dependency this binary carries.
  #
  # Everything netCDF needs (HDF5, zstd, bz2, szip/libaec, zlib) is linked
  # statically, alongside the C++ runtime -- so no netCDF/HDF5 install of
  # any version needs to exist on the target system at all. Deliberately
  # left dynamic: curl/xml2 (netCDF's optional OPeNDAP chain -- pulls in
  # OpenSSL/Kerberos/LDAP, inadvisable to freeze via static linking) and
  # the core X11/Xft/fontconfig stack (a stable OS-level ABI on any cluster
  # reachable via `ssh -X`). Xinerama/Xcursor support is disabled outright
  # (NCVIEW_STATIC_LINK does this automatically) rather than linked either
  # way: unlike the rest of X11, testing showed those two aren't reliably
  # preinstalled, and ncview doesn't depend on either for correctness.
  #
  # No ctest here: tests/ uses <filesystem>, which needs a newer libstdc++
  # than ubuntu:18.04's stock GCC 7 ships (GCC 8/9+ territory) -- the
  # regular linux/macos/windows/sanitize jobs above already cover
  # correctness on modern toolchains. This job's only job is proving the
  # binary itself -- app/ncview -- builds and links clean here.
  linux-static:
    runs-on: ubuntu-latest
    container: ubuntu:18.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq \
            g++ make git curl ca-certificates \
            libhdf5-dev zlib1g-dev libbz2-dev libzstd-dev libaec-dev \
            libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxfixes-dev \
            libexpat1-dev libcurl4-openssl-dev libxml2-dev \
            flex bison texinfo patchelf pkg-config

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ubuntu:18.04's own cmake package is 3.10 -- this project needs 3.21+
      # (see the top-level CMakeLists.txt's cmake_minimum_required).
      - name: Install a modern CMake
        run: |
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz -o /tmp/cmake.tar.gz
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          echo "/opt/cmake/bin" >> "$GITHUB_PATH"

      - name: Cache static netCDF-C build
        id: cache-netcdf-static
        uses: actions/cache@v4
        with:
          path: /opt/netcdf-static
          key: netcdf-static-4.9.2-ubuntu1804-v1

      # Every dependency below (HDF5, zlib, bz2, zstd, libaec/szip) ships a
      # static .a via its normal -dev package on Ubuntu -- netCDF-C itself
      # is the one exception (Ubuntu's libnetcdf-dev is .so-only), so it's
      # the one thing here built from source. ENABLE_BYTERANGE=OFF: this
      # netCDF feature's HTTP virtual file driver needs a newer HDF5 than
      # ubuntu:18.04 ships (references H5FD_FEAT_DEFAULT_VFD_COMPATIBLE,
      # absent from HDF5 1.10.0) -- unrelated to DAP/OPeNDAP support
      # proper, which stays on.
      - name: Build netCDF-C statically
        if: steps.cache-netcdf-static.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://downloads.unidata.ucar.edu/netcdf-c/4.9.2/netcdf-c-4.9.2.tar.gz -o /tmp/netcdf-c.tar.gz
          tar -xzf /tmp/netcdf-c.tar.gz -C /tmp
          cmake -S /tmp/netcdf-c-4.9.2 -B /tmp/netcdf-c-4.9.2/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/netcdf-static \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_EXAMPLES=OFF \
            -DENABLE_DAP=ON \
            -DENABLE_BYTERANGE=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build /tmp/netcdf-c-4.9.2/build -j"$(nproc)"
          cmake --install /tmp/netcdf-c-4.9.2/build

      # CMAKE_LIBRARY_PATH: Ubuntu's HDF5 packaging puts its libs under
      # .../hdf5/serial/ (to support parallel/serial variants side by side
      # via update-alternatives), which isn't on find_library()'s default
      # search path.
      - name: Configure
        run: |
          HDF5_LIBDIR="$(dirname "$(find /usr/lib -name 'libhdf5.a' | head -1)")"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH=/opt/netcdf-static \
            -DCMAKE_LIBRARY_PATH="$HDF5_LIBDIR" \
            -DFLTK_BUILD_GL=OFF \
            -DNCVIEW_STATIC_LINK=ON

      - name: Build
        run: cmake --build build --target ncview -j"$(nproc)"

      # patchelf --print-needed lists only this binary's own direct NEEDED
      # entries, not the full transitive tree ldd would show (which
      # includes other programs' unrelated dependencies, e.g. libbz2 or
      # libz pulled in by libcurl/libssh -- not a sign anything here linked
      # dynamically that shouldn't have).
      - name: Verify the static libraries actually didn't link dynamically
        run: |
          patchelf --print-needed build/app/ncview
          ! patchelf --print-needed build/app/ncview | grep -qiE "netcdf|hdf5|^libsz|libaec|zstd|Xinerama|Xcursor"

      # Packaged by hand (not CPack's own `package` target) since that
      # target depends on the `tests` target this job deliberately doesn't
      # build (see the job comment above) -- .tar.gz so release.yml's
      # existing `find ... -name '*.tar.gz'` glob picks this up alongside
      # the other three platforms' CPack-built archives with no changes
      # needed there.
      - name: Package
        run: |
          tar -C build/app -czf ncview-0.1.0-Linux-static-x86_64.tar.gz ncview

      - uses: actions/upload-artifact@v4
        with:
          name: ncview-linux-static
          path: ncview-0.1.0-Linux-static-x86_64.tar.gz
